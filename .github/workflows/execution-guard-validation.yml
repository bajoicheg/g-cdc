name: Execution Guard Validation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/continuous-development-cycle/execution/execution_guard.py'
      - 'src/continuous-development-cycle/tests/test_execution_guard.py'

permissions:
  contents: read

jobs:
  execution-guard-tests:
    name: Execution Guard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Execution Guard tests
        run: python -B -m unittest src/continuous-development-cycle/tests/test_execution_guard.py -v

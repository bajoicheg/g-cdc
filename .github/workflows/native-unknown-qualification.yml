name: Native UNKNOWN recovery qualification
on:
  push:
    branches: [cdc/native-unknown-recovery-20261013, cdc/native-unknown-recovery-364-20261014, cdc/sdk-admission-budget-20261014]
permissions:
  contents: read
concurrency:
  group: cdc-native-unknown-qualification
  cancel-in-progress: false
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install declared validator dependency
        run: python3 -m pip install 'PyYAML==6.0.2'
      - name: Independent bootstrap and release bindings
        run: |
          python3 -B bootstrap/validate_release.py --mode full
          python3 -B -m unittest discover -s bootstrap/tests -v
      - name: Independent package structure
        run: python3 -B src/continuous-development-cycle/scripts/validate_package.py
      - name: Three authenticated supported consumer projections
        run: |
          package_tree=$(git rev-parse HEAD:src/continuous-development-cycle)
          python3 -B src/continuous-development-cycle/scripts/supported_consumer_qualification.py --snapshot-root consumer/supported --consumers fleet-1 fleet-2 fleet-3 --package-tree "$package_tree"
      - name: Stage immutable development-baseline reader for compatibility regression
        run: |
          python3 -B - <<'PYREADER'
          import json, os, pathlib, subprocess, tarfile, io
          lock=json.loads(pathlib.Path('release/source.lock.json').read_text())
          commit='edefea0c4e1aa75ce609600f645ab6c938323126'
          actual=subprocess.check_output(['git','rev-parse',commit+':src/continuous-development-cycle'],text=True).strip()
          assert actual == 'c55b9d1f78079c4d57d39180795d26293986c8d5'
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'cdc-development-baseline-reader'
          root.mkdir()
          archive=subprocess.check_output(['git','archive',commit,'src/continuous-development-cycle'])
          with tarfile.open(fileobj=io.BytesIO(archive)) as stream:
              stream.extractall(root,filter='data')
          package=root/'src/continuous-development-cycle'
          assert (package/'VERSION').read_text().strip() == '3.6.3'
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('CDC_TEST_LEGACY_SDK_363_ROOT='+str(package)+'\n')
          PYREADER
      - name: FULL packaged regressions in clean consumer layout
        run: python3 -B bootstrap/consumer_package_checks.py

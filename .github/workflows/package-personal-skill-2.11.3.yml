name: Package CDC 2.11.3 Personal Skill

on:
  push:
    branches:
      - cdc/package-personal-skill-2.11.3

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout immutable CDC release
        uses: actions/checkout@v4
        with:
          ref: refs/heads/release/v2.11.3
          fetch-depth: 0

      - name: Verify immutable package tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:src/continuous-development-cycle)" = "39f733127ac130de4f647cf9e5ec55afcca0769c"
          test "$(cat src/continuous-development-cycle/VERSION)" = "2.11.3"

      - name: Build installable skill ZIP and verify extracted tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cdc-skill /tmp/cdc-readback
          mkdir -p /tmp/cdc-skill/continuous-development-cycle
          cp -a src/continuous-development-cycle/. /tmp/cdc-skill/continuous-development-cycle/
          (
            cd /tmp/cdc-skill
            zip -qr "$GITHUB_WORKSPACE/continuous-development-cycle-2.11.3.zip" continuous-development-cycle
          )
          mkdir -p /tmp/cdc-readback
          unzip -q "$GITHUB_WORKSPACE/continuous-development-cycle-2.11.3.zip" -d /tmp/cdc-readback
          git -C /tmp/cdc-readback init -q
          git -C /tmp/cdc-readback config core.autocrlf false
          git -C /tmp/cdc-readback add -f continuous-development-cycle
          ROOT_TREE="$(git -C /tmp/cdc-readback write-tree)"
          READBACK_TREE="$(git -C /tmp/cdc-readback rev-parse "$ROOT_TREE:continuous-development-cycle")"
          test "$READBACK_TREE" = "39f733127ac130de4f647cf9e5ec55afcca0769c"
          sha256sum "$GITHUB_WORKSPACE/continuous-development-cycle-2.11.3.zip" > "$GITHUB_WORKSPACE/continuous-development-cycle-2.11.3.zip.sha256"
          cat "$GITHUB_WORKSPACE/continuous-development-cycle-2.11.3.zip.sha256"

      - name: Upload installable skill package
        uses: actions/upload-artifact@v4
        with:
          name: continuous-development-cycle-2.11.3-personal-skill
          path: |
            continuous-development-cycle-2.11.3.zip
            continuous-development-cycle-2.11.3.zip.sha256
          if-no-files-found: error
          retention-days: 14

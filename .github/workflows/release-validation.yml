name: CDC Release Validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cdc-release-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-validation:
    name: Bootstrap + package + three consumers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Independent bootstrap before candidate imports
        run: |
          python -B bootstrap/validate_release.py --mode bootstrap
          python -B -m unittest discover -s bootstrap/tests -v

      - name: Install validator dependency
        run: python -m pip install -r src/continuous-development-cycle/scripts/requirements.txt

      - name: Validate candidate package
        working-directory: src/continuous-development-cycle
        run: python -B scripts/validate_package.py

      - name: Full candidate tests
        run: python -B -m unittest discover -s src/continuous-development-cycle/tests -v

      - name: Full bootstrap binding
        run: python -B bootstrap/validate_release.py --mode full

      - name: Validate three live consumer snapshots
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_TREE="$(git rev-parse HEAD:src/continuous-development-cycle)"
          CANDIDATE="$(cat VERSION)"
          for consumer in g-supervisor g-ad-control g-pc-health-check; do
            python -B src/continuous-development-cycle/scripts/validate_adapter.py "consumer/evidence/$consumer/development-cycle.yaml"
            python -B src/continuous-development-cycle/scripts/validate_checkpoint_24.py "consumer/evidence/$consumer/work-status.md" --adapter "consumer/evidence/$consumer/development-cycle.yaml"
            python -B src/continuous-development-cycle/scripts/validate_snapshot_diagnostics.py "$consumer" "$CANDIDATE" "$PACKAGE_TREE"
            python -B -c 'import json, pathlib, sys; c=sys.argv[1]; d=json.loads((pathlib.Path("consumer/evidence")/c/"source.json").read_text()); print("CONSUMER_GREEN",c,d["repository"],d["source_commit"],d["vendored_cdc_version"])' "$consumer"
          done
          echo "THREE_CONSUMERS_GREEN package_tree=$PACKAGE_TREE"

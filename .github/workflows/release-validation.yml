name: CDC Release Validation
run-name: CDC release / ${{ inputs.cdc_attempt_id || github.run_id }} / ${{ inputs.cdc_operation_key || github.sha }}

on:
  workflow_dispatch:
    inputs:
      cdc_operation_key:
        description: Durable CDC operation key
        required: false
        type: string
      cdc_attempt_id:
        description: Durable CDC attempt identifier
        required: false
        type: string
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cdc-release-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate-main:
    name: Full candidate tests (exact remaining partition)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      inventory: ${{ steps.tests.outputs.inventory_sha256 }}
      total: ${{ steps.tests.outputs.total_tests }}
      selected: ${{ steps.tests.outputs.selected_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact candidate checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Checkout pinned legacy reader compatibility fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bajoicheg/g-cdc
          ref: edefea0c4e1aa75ce609600f645ab6c938323126
          path: .qualification-sdk363
          persist-credentials: false
      - name: Verify legacy reader source and package pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .qualification-sdk363 rev-parse HEAD)" = edefea0c4e1aa75ce609600f645ab6c938323126
          test "$(git -C .qualification-sdk363 rev-parse HEAD:src/continuous-development-cycle)" = c55b9d1f78079c4d57d39180795d26293986c8d5
          echo "CDC_TEST_LEGACY_SDK_363_ROOT=$GITHUB_WORKSPACE/.qualification-sdk363/src/continuous-development-cycle" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository code and test placement
        run: python -B bootstrap/repository_layout.py
      - name: Independent bootstrap before candidate imports
        run: |
          python -B bootstrap/validate_release.py --mode bootstrap
          python -B -m unittest discover -s bootstrap/tests -v
      - name: Install validator dependency
        run: python -m pip install -r src/continuous-development-cycle/scripts/requirements.txt
      - name: Validate candidate package
        working-directory: src/continuous-development-cycle
        run: python -B scripts/validate_package.py
      - name: Full candidate tests excluding exactly the host bridge module
        id: tests
        run: python -B bootstrap/run_candidate_tests.py --partition remaining
      - name: Full bootstrap binding
        run: python -B bootstrap/validate_release.py --mode full
      - name: Validate three supported Fleet projections
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_TREE="$(git rev-parse HEAD:src/continuous-development-cycle)"
          python -B src/continuous-development-cycle/scripts/supported_consumer_qualification.py \
            --snapshot-root consumer/supported \
            --consumers fleet-1 fleet-2 fleet-3 \
            --package-tree "$PACKAGE_TREE"

  candidate-host-bridge:
    name: Full candidate tests (exact host bridge partition)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      inventory: ${{ steps.tests.outputs.inventory_sha256 }}
      total: ${{ steps.tests.outputs.total_tests }}
      selected: ${{ steps.tests.outputs.selected_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Require exact candidate checkout
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Checkout pinned legacy reader compatibility fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: bajoicheg/g-cdc
          ref: edefea0c4e1aa75ce609600f645ab6c938323126
          path: .qualification-sdk363
          persist-credentials: false
      - name: Verify legacy reader source and package pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .qualification-sdk363 rev-parse HEAD)" = edefea0c4e1aa75ce609600f645ab6c938323126
          test "$(git -C .qualification-sdk363 rev-parse HEAD:src/continuous-development-cycle)" = c55b9d1f78079c4d57d39180795d26293986c8d5
          echo "CDC_TEST_LEGACY_SDK_363_ROOT=$GITHUB_WORKSPACE/.qualification-sdk363/src/continuous-development-cycle" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository code and test placement
        run: python -B bootstrap/repository_layout.py
      - name: Independent bootstrap before candidate imports
        run: |
          python -B bootstrap/validate_release.py --mode bootstrap
          python -B -m unittest discover -s bootstrap/tests -v
      - name: Install validator dependency
        run: python -m pip install -r src/continuous-development-cycle/scripts/requirements.txt
      - name: Full candidate tests for exactly the host bridge module
        id: tests
        run: python -B bootstrap/run_candidate_tests.py --partition host-bridge

  release-validation:
    name: Bootstrap + package + supported Fleet projections
    needs: [candidate-main, candidate-host-bridge]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require both complete successful partitions and identical inventories
        env:
          MAIN_RESULT: ${{ needs.candidate-main.result }}
          BRIDGE_RESULT: ${{ needs.candidate-host-bridge.result }}
          MAIN_INVENTORY: ${{ needs.candidate-main.outputs.inventory }}
          BRIDGE_INVENTORY: ${{ needs.candidate-host-bridge.outputs.inventory }}
          MAIN_TOTAL: ${{ needs.candidate-main.outputs.total }}
          BRIDGE_TOTAL: ${{ needs.candidate-host-bridge.outputs.total }}
          MAIN_SELECTED: ${{ needs.candidate-main.outputs.selected }}
          BRIDGE_SELECTED: ${{ needs.candidate-host-bridge.outputs.selected }}
        run: |
          python -B - <<'PY'
          import os, re
          values = os.environ
          assert values['MAIN_RESULT'] == values['BRIDGE_RESULT'] == 'success', 'both partitions must succeed'
          digest = values['MAIN_INVENTORY']
          assert re.fullmatch(r'[0-9a-f]{64}', digest) and digest == values['BRIDGE_INVENTORY'], 'discovery inventories differ'
          names = ('MAIN_TOTAL', 'BRIDGE_TOTAL', 'MAIN_SELECTED', 'BRIDGE_SELECTED')
          assert all(re.fullmatch(r'[1-9][0-9]*', values[name]) for name in names), 'partition counts are absent or empty'
          assert values['MAIN_TOTAL'] == values['BRIDGE_TOTAL'], 'discovery totals differ'
          assert int(values['MAIN_SELECTED']) + int(values['BRIDGE_SELECTED']) == int(values['MAIN_TOTAL']), 'partition union is incomplete'
          print('FULL_CANDIDATE_GREEN: both exact partitions completed without skipped tests')
          PY
